name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Tokens atualizados
        run: dotnet run tools/gen-tokens/gen-tokens.cs -- --check

      - name: Build
        run: dotnet build improve.sln -c Release

      - name: Testes
        run: dotnet test --solution improve.sln -c Release --no-build
